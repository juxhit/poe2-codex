site_name: Path of Exile 2 — Codex
site_description: Path of Exile 2 — Codex: bilingual (EN/RU) knowledge database — classes, ascendancies, mechanics, crafting, items, guides. Snapshot 0.5.x, updated for 1.0.
exclude_docs: |
  meta/templates/*
repo_url: https://github.com/juxhit/poe2-codex
repo_name: juxhit/poe2-codex
docs_dir: database

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search
  - i18n:
      docs_structure: suffix
      default_language: en
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ru
          name: Русский
          build: true

nav:
  - Home: README.md
  - Game overview: game.md
  - Classes: classes/
  - Ascendancies: ascendancies/
  - Mechanics: mechanics/
  - Crafting: crafting/
  - Items: items/
  - Skills: skills/
  - Guides: guides/
  - Bosses: bosses/
  - Passive tree: passive-tree/
  - Cheatsheets: cheatsheets/
  - 1.0 release: 1.0/
  - Glossary: glossary.md
  - Lore: lore.md
  - Leagues & patches: leagues/
  - Meta: meta/
